---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - pod.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: fio-nfs-tests
    files:
      - scripts/00-common.sh
      - scripts/01-storage-info.sh
      - scripts/02-mountstats-before.sh
      - scripts/03-mountstats-after.sh
      - scripts/04-mountstats-raw-diff.sh
      - scripts/05-mountstats-op-delta.sh
      - scripts/10-sanity-write.sh
      - scripts/20-sequential-write-limited.sh
      - scripts/21-random-read-limited.sh
      - scripts/22-random-write-limited.sh
      - scripts/23-fdatasync-limited.sh
      - scripts/30-sequential-write-full.sh
      - scripts/31-sequential-read-full.sh
      - scripts/32-random-read-4k-full.sh
      - scripts/33-random-write-4k-full.sh
      - scripts/34-mixed-16k-full.sh
      - scripts/35-fdatasync-full.sh
      - scripts/40-summarize-results.sh
      - scripts/41-summarize-mountstats.sh
      - scripts/90-run-limited-suite.sh
      - scripts/91-run-full-suite.sh
      - scripts/99-cleanup.sh
